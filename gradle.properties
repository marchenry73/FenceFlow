org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.parallel=true

# ONE-SHOT BUILDS, NO LINGERING DAEMON.
#
# The publish gate runs Gradle TWICE -- scripts/check-parity.mjs, then
# gradlew testDebugUnitTest -- sequentially, via spawnSync. With the daemon on,
# the FIRST call's daemon stays alive after spawnSync returns and the second
# call starts its own, so two JVMs both believe they own app/build. On
# 5 Oct 2026 that cost a release: half an hour into a publish, with every gate
# already green, the second Gradle run died with
#
#   FileSystemException: app\build\kotlin\compileDebugUnitTestKotlin\cacheable\
#   dirty-sources.txt: The process cannot access the file because it is being
#   used by another process
#
# Two daemons were still alive afterwards, started four minutes apart -- one
# per Gradle call, which is how the cause was identified rather than guessed.
#
# gradlew --stop does NOT reap an orphan: it only stops daemons whose JVM args
# match the current invocation. So this has to be prevented, not cleaned up
# afterwards. For release builds and CI-style gate runs a warm JVM is worth far
# less than never hitting a stale lock. File watching goes with it, because
# that is what holds the handle open after the build has finished.
#
# This is the same fix CLAUDE.md records as the durable one for `ledger`; this
# project had never had it.
org.gradle.daemon=false
org.gradle.vfs.watch=false
