<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get a Fence Quote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  :root{--graphite:#0F1826;--graphite2:#1E2A3D;--orange:#FF5A1F;--orange-dk:#B23800;
        --paper:#F7F8FA;--line:#E3E7ED;--text:#12151A;--muted:#5A6472;--ok:#0B6B4F}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--paper);color:var(--text)}
  header{background:linear-gradient(180deg,var(--graphite2),var(--graphite));color:#fff;
         padding:18px 20px;border-top:3px solid var(--orange)}
  header .co{font:700 26px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;
             text-transform:uppercase}
  header .sub{font-size:13px;color:#8A93A3;margin-top:4px}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 60px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
  label{display:block;font-size:11px;font-weight:600;margin:12px 0 4px;color:var(--muted);
        text-transform:uppercase;letter-spacing:.4px}
  input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;
        font-size:16px;font-family:inherit}
  textarea{min-height:80px;resize:vertical}
  .btn{display:block;width:100%;background:var(--orange);color:#fff;border:none;
       padding:14px;border-radius:9px;font-weight:700;font-size:16px;cursor:pointer;margin-top:16px}
  .btn:hover{background:var(--orange-dk)}
  .btn:disabled{opacity:.55}
  .msg{border-radius:8px;padding:11px 14px;font-size:14px;margin-top:12px;display:none}
  .msg.err{background:#FDECEC;color:#8C1114}
  .msg.on{display:block}
  .done{background:#E6F6F1;border:1px solid #BFE6D8;color:var(--ok);border-radius:12px;
        padding:20px;font-size:15.5px;display:none}
  .foot{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
  .foot b{font:700 13px "Barlow Condensed",sans-serif;text-transform:uppercase}
  .foot b span{color:var(--orange)}
</style>
</head>
<body>
<header>
  <div class="co" id="coName">Get a fence quote</div>
  <div class="sub">Tell us about your fence — we'll call you back to set up a free quote.</div>
</header>
<div class="wrap">
  <div class="done" id="done"></div>
  <form class="panel" id="form">
    <label data-t="name">Your name</label><input id="f_name" autocomplete="name" required>
    <label data-t="phone">Phone</label><input id="f_phone" type="tel" autocomplete="tel">
    <label data-t="email">Email</label><input id="f_email" type="email" autocomplete="email">
    <label data-t="address">Property address</label><input id="f_addr" autocomplete="street-address"
      placeholder="Street, City, ST ZIP" data-t="addressPh">
    <label data-t="want">What are you looking for?</label>
    <textarea id="f_notes" placeholder="Around 120 ft of wood privacy fence, one gate…" data-t="wantPh"></textarea>
    <button class="btn" id="go" type="submit" data-t="submit">Request my quote</button>
    <div class="msg err" id="err"></div>
  </form>
  <p class="foot" style="display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap">
    <span>Powered by <b>Fence<span>Flow</span></b></span>
    <span id="langPick" style="opacity:.75"></span>
  </p>
</div>

<script>
const L = {
  en: {
    title: 'Get a fence quote',
    lede: 'Tell us what you need and we will get back to you.',
    name: 'Your name', phone: 'Phone', email: 'Email',
    address: 'Property address', addressPh: 'Street, City, ST ZIP',
    want: 'What are you looking for?',
    wantPh: 'Around 120 ft of wood privacy fence, one gate…',
    submit: 'Request my quote',
    thanks: 'Got it — ',
    thanksTail: ' will call you back to set up your free quote. Thank you!',
    team: 'the team',
    sendError: 'Could not send just now.',
  },
  es: {
    title: 'Pida un presupuesto de cerca',
    lede: 'Cuéntenos qué necesita y le respondemos.',
    name: 'Su nombre', phone: 'Teléfono', email: 'Correo electrónico',
    address: 'Dirección de la propiedad', addressPh: 'Calle, ciudad, estado, código postal',
    want: '¿Qué está buscando?',
    wantPh: 'Unos 120 pies de cerca de madera de privacidad, un portón…',
    submit: 'Pedir mi presupuesto',
    thanks: 'Recibido — ',
    thanksTail: ' le llamará para concretar su presupuesto gratis. ¡Gracias!',
    team: 'el equipo',
    sendError: 'No se pudo enviar en este momento.',
  },
  fr: {
    title: 'Demandez un devis de clôture',
    lede: 'Dites-nous ce qu\u2019il vous faut et nous vous recontactons.',
    name: 'Votre nom', phone: 'Téléphone', email: 'Courriel',
    address: 'Adresse du bien', addressPh: 'Rue, ville, état, code postal',
    want: 'Que cherchez-vous ?',
    wantPh: 'Environ 120 pieds de clôture bois pleine, un portail…',
    submit: 'Demander mon devis',
    thanks: 'Bien reçu — ',
    thanksTail: ' vous rappellera pour organiser votre devis gratuit. Merci !',
    team: 'l’équipe',
    sendError: 'Impossible d’envoyer pour le moment.',
  },
};

let LANG = 'en';
(function () {
  let asked = '';
  try { asked = (new URLSearchParams(location.search).get('lang') || '').slice(0,2).toLowerCase(); } catch (e) {}
  const browser = (navigator.language || 'en').slice(0,2).toLowerCase();
  const pick = [asked, browser].find(c => c && L[c]);
  if (pick) LANG = pick;
})();

function tr(key) {
  const args = [].slice.call(arguments, 1);
  let out = (L[LANG] && L[LANG][key]) || L.en[key] || '';
  args.forEach(a => { out = out.replace('%s', a); });
  return out;
}

function applyStaticText() {
  document.documentElement.lang = LANG;
  document.title = tr('title');
  document.querySelectorAll('[data-t]').forEach(el => {
    const k = el.getAttribute('data-t');
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = tr(k);
    else el.textContent = tr(k);
  });
  const pick = document.getElementById('langPick');
  if (pick) {
    pick.innerHTML = ['en','es','fr'].map(c =>
      c === LANG ? '<b>' + c.toUpperCase() + '</b>'
                 : '<a href="#" data-lang="' + c + '" style="color:inherit">' + c.toUpperCase() + '</a>'
    ).join(' · ');
    pick.querySelectorAll('a[data-lang]').forEach(a =>
      a.addEventListener('click', e => {
        e.preventDefault();
        try { const u = new URL(location.href); u.searchParams.set('lang', a.dataset.lang); location.href = u.toString(); }
        catch (err) { /* older browser: leave it in English */ }
      }));
  }
}
document.addEventListener('DOMContentLoaded', applyStaticText);
</script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
// Through config.js like every other page. This one carried the project URL
// on its own, so a dev copy of the site would have posted real homeowners'
// requests straight into the production jobs table with no red banner to
// say so.
const API=window.FENCEFLOW_CONFIG.SUPABASE_URL+'/functions/v1';
const token=new URLSearchParams(location.search).get('c')||'';
$('form').addEventListener('submit', async e=>{
  e.preventDefault();
  const err=$('err'); err.classList.remove('on');
  $('go').disabled=true;
  try{
    const r=await fetch(API+'/lead-intake?c='+encodeURIComponent(token),{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:$('f_name').value,phone:$('f_phone').value,
        email:$('f_email').value,address:$('f_addr').value,notes:$('f_notes').value})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||tr('sendError'));
    $('form').style.display='none';
    $('done').style.display='block';
    $('done').textContent=tr('thanks')+(j.company||tr('team'))+tr('thanksTail');
    if(j.company) $('coName').textContent=j.company;
  }catch(ex){ err.textContent=ex.message; err.classList.add('on'); $('go').disabled=false; }
});
</script>
</body>
</html>
