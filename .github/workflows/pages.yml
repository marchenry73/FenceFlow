# Publishes the website/ folder to GitHub Pages on every push to main.
#
# A workflow is used rather than Pages' "deploy from a branch" option because
# the site lives in a subfolder alongside the Android project, and the branch
# option can only serve the repository root or /docs.
#
# Nothing used to stand between a push and the live office. The two checks
# below already existed and were run by hand (and one of them by
# publish-release.mjs, which gates the APK, not the website) -- so the office
# page could be, and once was, deployed broken: a stray apostrophe inside the
# page's single <script type="module"> left every contractor looking at
# "Loading your office…" for a day and a half, and no step in this file had an
# opinion about it. The gate is placed before configure-pages so a red check
# costs seconds and never touches the Pages deployment at all.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 24 because that is what these run on locally and what the repo's other
      # .mjs tooling assumes; both files are plain node with no dependencies,
      # so there is nothing to install and no lockfile to cache.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Deliberately two steps rather than one multi-line `run`. A failure then
      # names itself in the job list instead of hiding inside a script block --
      # and there is no shell composition here at all, so there is no way for
      # an exit code to be swallowed by a pipe or a trailing command. That
      # mistake has been made in this project's build scripts more than once.

      # Parses every page's inline and external module exactly as the browser
      # will, and checks every id the script reaches for exists in the markup,
      # exactly once.
      - name: Gate - website page syntax and element ids
        run: node tests/dashboard-syntax.test.mjs

      # Parsing catches a typo in the syntax; it cannot catch a name. This
      # catches a call to a function that does not exist anywhere on the page
      # -- the shape that silently killed all three QuickBooks export buttons.
      - name: Gate - no calls to functions that do not exist
        run: node tests/dashboard-undefined-calls.test.mjs

      # Syntax and names are both satisfied by a control that is PRESENT and
      # reaches nothing. This asks the question those two cannot: is the thing
      # wired to anything -- does the search box call the RPC, does + New point
      # at a button that exists, has every nav tab still got its panel. Written
      # because SideTypesCard passed its own tests for days while mounted on no
      # screen at all.
      - name: Gate - the office shell is wired, not just present
        run: node tests/a84-office-shell-wired.test.mjs

      # And this proves the gate above can fail: it breaks a copy of the page
      # eight ways and requires the matching check to go red each time. It
      # already caught one check that could not -- a prefix match that a renamed
      # function slipped straight past.
      - name: Gate - those wiring checks can actually fail
        run: node tests/a84-mutate.mjs

      # Behavioural, not static: mail-render.mjs is a real module, so this calls
      # the placeholder guard the way the compose sheet calls it and asserts on
      # what comes back -- then checks the send path actually asks it. Every
      # other check in sendCompose was about addresses, counts and sizes, so
      # "Hi {{customer_first_name}}," had nothing in its way.
      - name: Gate - no unfilled placeholder can reach a customer
        run: node tests/a85-unfilled-placeholder-guard.test.mjs

      # Cross-file: the office calls two SECURITY DEFINER functions, and
      # PostgREST matches a function by name AND argument names. p_enabled
      # spelled enabled is a 404 at the click and a compile error nowhere. This
      # reads the SQL, not just the page.
      - name: Gate - the alert panel reaches the server that exists
        run: node tests/a86-attention-panel-wired.test.mjs

      - name: Gate - those cross-file checks can actually fail
        run: node tests/a86-mutate.mjs

      # The price request we send suppliers claims their reply will import.
      # This runs the office's OWN parser over it -- ppParseTable,
      # ppDetectColumns, ppReadRows lifted out of the page -- so a change to
      # the importer that would break the sheet fails here rather than on the
      # day a supplier sends it back.
      - name: Gate - the supplier price request still imports
        run: node tests/a88-supplier-rfq-imports.test.mjs

      # Follow-ups were switched ON with every individual rule OFF, and the
      # due-list honours the rules -- so it sat empty under a ticked master
      # switch while three opened-and-unanswered quotes were on the books.
      # The screen has to tell "nothing to do" from "nothing is looking".
      - name: Gate - the follow-up panel says which kind of nothing it is
        run: node tests/a89-followup-state-is-honest.test.mjs

      # The office cannot be driven headlessly without a login, so every change
      # to these panels has gone live unexercised. This LIFTS renderAttention
      # out of the page and RUNS it against a fake DOM in all three of the
      # states it has to tell apart -- a throw here is a throw in his browser.
      - name: Gate - the alert panel actually renders
        run: node tests/a90-attention-panel-renders.test.mjs

      - name: Gate - the follow-up panel actually renders
        run: node tests/a91-followup-panel-renders.test.mjs

      # Covers BOTH render tests: five mutations, each of which must make its
      # own suite go red. The first is a typo'd global -- the case no grep in
      # this repo would catch.
      - name: Gate - and those render tests catch a runtime break
        run: node tests/a90-mutate.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
