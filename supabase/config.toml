# Which functions are allowed to be called without a Supabase login.
#
# Without this file the CLI defaults verify_jwt to TRUE for every function it
# deploys. Three of these must be false, and getting that wrong is silent and
# expensive: deploy stripe-webhook with verification on and the API gateway
# rejects every Stripe event with a 401 before the function ever runs, so
# payments quietly stop being marked paid and subscriptions stop activating.
# Nothing in the product says anything is wrong; the only trace is 401s in the
# Stripe dashboard. Pinned here so it cannot depend on remembering a flag.
project_id = "newcrgafcptspmapacrx"

# Stripe signs its own requests and sends no Supabase JWT. The function checks
# the signature itself.
[functions.stripe-webhook]
verify_jwt = false

# Called by a Postgres trigger through pg_net, which carries no user session.
# Guarded by its own shared secret.
[functions.notify-job-change]
verify_jwt = false

# Serves the app download to a phone that has not signed in yet -- that is the
# whole point of it.
[functions.apk-proxy]
verify_jwt = false

# The rest are called by a signed-in person from the website, and the function
# reads that session to decide what they are allowed to do. Verification on.
[functions.create-checkout-session]
verify_jwt = true

# Two doors now: the office (the function checks its own JWT inside) and a
# homeowner holding a quote token, who has no JWT and never will. The gateway
# must let both reach the function; the function is the bouncer for each.
[functions.create-payment-link]
verify_jwt = false

[functions.invite-company]
verify_jwt = true

# One door -- the signed-in office -- same shape as price-job just below, and
# for the same reason: the function re-checks company, role and
# company_allowed() itself, so the gateway checking a JWT first buys nothing
# except rejecting the browser's own CORS preflight, which carries no bearer
# token. That is exactly the "Failed to fetch" price-job and
# create-payment-link both hit before this comment existed.
[functions.invite-crew]
verify_jwt = false

# Only the signed-in office calls this, and it never will hold a homeowner's
# link the way create-payment-link and quote-view do -- one door, so the
# gateway can reject a missing or invalid JWT before the function ever runs.
# The function still re-checks company, role and the SEE_MONEY permission
# itself: verify_jwt only proves SOMEONE is signed in, not that this caller
# may see this job's money.
[functions.price-job]
# The function validates the caller itself (getUser on the bearer token, then
# role and permission checks). With the gateway checking too, the browser's
# CORS preflight -- which carries no token -- was refused and the office saw
# "Failed to fetch", exactly as create-payment-link and quote-view found before.
verify_jwt = false

# Square signs its own requests and sends no Supabase JWT, exactly like Stripe.
# Leaving this out is what made the first deploy answer 401 at the gateway
# before the function ran at all.
[functions.square-webhook]
verify_jwt = false

# The OAuth callback arrives as a plain browser redirect from Square, with no
# JWT of any kind. The "start" half checks the caller's token itself, in code,
# and refuses without one -- so the gateway must not check first.
[functions.square-oauth]
verify_jwt = false

# Same two-faced URL as square-oauth: the callback arrives from Stripe with
# no JWT, so the gateway must let it through and the function checks the
# start half itself.
[functions.stripe-connect]
verify_jwt = false

# The homeowner opening a quote link has no JWT and never will; the
# unguessable token in the URL is the authorisation, checked by the function.
[functions.quote-view]
verify_jwt = false

# Public imagery and geocoding proxy for the 3D quote page; nothing behind
# it is sensitive and its callers hold no JWT.
[functions.quote-map]
verify_jwt = false

# Homeowners posting quote requests hold no JWT; the leads token is the key.
[functions.lead-intake]
verify_jwt = false

# Called by a Postgres trigger through pg_net (supabase_r6_welcome_email.sql),
# which carries no user session -- same shape as notify-job-change. What
# replaces the gateway's check: the trigger sends a secret it reads from
# Vault, and the function refuses anything whose secret
# welcome_email_trigger_ok() (service role only) does not accept, before it
# reads the body. The recipient and the words come from the database, and
# welcome_sent_at is claimed atomically, so even a valid call can only cause
# the one welcome email, to the company's own owner, once.
[functions.send-welcome-email]
verify_jwt = false

# ---- Company email (supabase_mail.sql). All five are verify_jwt = false. ----
# None of them trusts the gateway, and three of them could not work with it:
# the office's CORS preflight carries no token, and Resend and the GitHub
# schedule carry no Supabase JWT at all. Each one is its own bouncer, and
# the service-role client they use exists only after that check passes.
#
# The office door, shared by mail-connect, mail-message, mail-send and
# mail-sync, is _shared/mail/caller.ts mailCaller(): a bearer token, then
# getUser() on it, then can_use_company_mail() asked with the CALLER's own
# token, which must answer exactly true (crew, suspended companies and
# anyone without "See prices and money" get false). Any row named by id is
# then read through the caller's own client, so RLS proves it is in their
# company before the service role touches it.

# Connect, check, change the app password of, and disconnect the company's
# mailbox; plus a status read. The office door above; everything except
# "status" also requires the OWNER role, checked in the function. The app
# password is verified against the mail server and stored only in Vault.
[functions.mail-connect]
verify_jwt = false

# Two doors. The office (the door above) syncs its own company's mailboxes.
# The schedule in .github/workflows/mail-sync.yml holds no JWT; it sends
# x-fenceflow-trigger, compared in constant time against
# MAIL_SYNC_TRIGGER_SECRET, and an unset secret refuses everything
# (caller.ts triggerCaller). That door answers with counts only.
[functions.mail-sync]
verify_jwt = false

# Opens a message, marks it read or unread, mints a 60-second attachment
# link. The office door above; the message is read through the caller's own
# client first, so RLS decides whether they may see it at all.
[functions.mail-message]
verify_jwt = false

# Sends from a connected mailbox or as FenceFlow mail. The office door
# above, plus rate limits from the mail_events ledger; the From address is
# always the account's own (or FenceFlow's fixed one), never the request's.
[functions.mail-send]
verify_jwt = false

# Resend's email.received webhook: signed by svix, no Supabase JWT. The
# function verifies the svix signature over the raw body with
# RESEND_WEBHOOK_SECRET (unset = refuse) and answers 401 before acting on
# anything unsigned; mail is routed only by an inbound_token that exists,
# and each company is capped per day.
[functions.resend-inbound]
verify_jwt = false
